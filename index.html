<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎯 幸运大转盘</title>
    <style>
        /* ========== 全局重置 & 基础 ========== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #1a1a2e, #16213e, #0f3460);
            font-family: 'Poppins', 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 32px 40px 40px;
            max-width: 780px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200, #f7971e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(255, 210, 0, 0.2);
            animation: shimmerTitle 4s ease-in-out infinite;
        }
        @keyframes shimmerTitle {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }
        .header .badge {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto 18px;
            aspect-ratio: 1 / 1;
            touch-action: none;
        }

        .wheel-wrapper canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 0 4px rgba(255, 255, 255, 0.08), 0 0 0 8px rgba(255, 255, 255, 0.04);
            transition: box-shadow 0.3s;
            background: #1e1e2f;
        }
        .wheel-wrapper canvas:active {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        }

        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 6px 12px rgba(255, 50, 50, 0.5));
            transition: filter 0.3s;
            pointer-events: none;
        }
        .pointer svg {
            display: block;
            width: 44px;
            height: 48px;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }
        .pointer.active {
            filter: drop-shadow(0 8px 20px rgba(255, 50, 50, 0.9));
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 6px;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: stretch;
            flex-wrap: wrap;
        }
        .input-row textarea {
            flex: 1;
            min-width: 180px;
            padding: 12px 16px;
            border-radius: 20px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            min-height: 52px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            line-height: 1.6;
        }
        .input-row textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
        }
        .input-row textarea:focus {
            border-color: #ffd700;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.15);
        }
        .input-row textarea:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ========== 标签列表 ========== */
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 8px 4px;
            min-height: 42px;
            align-items: center;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }
        .tag-list:empty::before {
            content: '✨ 暂无名字，请在输入框中添加';
            color: rgba(255, 255, 255, 0.25);
            font-size: 14px;
            padding: 8px 0;
            width: 100%;
            text-align: center;
        }
        .tag-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            padding: 4px 12px 4px 16px;
            border-radius: 40px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: background 0.2s, transform 0.15s;
            animation: fadeInTag 0.2s ease;
        }
        @keyframes fadeInTag {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .tag-item:hover {
            background: rgba(255, 255, 255, 0.18);
        }
        .tag-item .delete-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1;
            padding: 0;
        }
        .tag-item .delete-btn:hover {
            background: rgba(255, 70, 70, 0.6);
            color: #fff;
            transform: scale(1.1);
        }
        .tag-item .delete-btn:active {
            transform: scale(0.9);
        }

        .action-row {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-primary {
            padding: 12px 34px;
            border: none;
            border-radius: 40px;
            font-size: 20px;
            font-weight: 700;
            font-family: inherit;
            color: #fff;
            background: linear-gradient(135deg, #f7971e, #ff6b35);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 24px rgba(255, 107, 53, 0.35);
            letter-spacing: 1px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 140px;
            position: relative;
            overflow: hidden;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 60%);
            pointer-events: none;
            border-radius: 40px;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 32px rgba(255, 107, 53, 0.5);
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(0px) scale(0.97);
        }
        .btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.15);
        }
        .btn-primary.is-stopping {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 8px 24px rgba(245, 87, 108, 0.4);
        }
        .btn-primary.is-stopping:hover:not(:disabled) {
            box-shadow: 0 12px 32px rgba(245, 87, 108, 0.55);
        }
        .btn-primary .icon {
            font-size: 22px;
        }

        .btn-secondary {
            padding: 10px 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
        }
        .btn-secondary.danger:hover {
            border-color: #ff6b6b;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
        }

        .counter {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        /* ========== 模态框 ========== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
            padding: 24px;
        }
        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: linear-gradient(145deg, #1e1e32, #2a1f3d);
            border-radius: 40px;
            padding: 44px 48px 36px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            opacity: 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .modal-overlay.open .modal-box {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-box .emoji-big {
            font-size: 60px;
            display: block;
            margin-bottom: 8px;
            animation: popEmoji 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes popEmoji {
            0% {
                transform: scale(0) rotate(-20deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .modal-box h2 {
            font-size: 22px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        .modal-box .result-name {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffd700, #ff6b35, #ffd700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 10px 0 20px;
            animation: shimmerResult 3s ease-in-out infinite;
            word-break: break-word;
        }
        @keyframes shimmerResult {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .modal-box .btn-close-modal {
            padding: 12px 44px;
            border: none;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            font-family: inherit;
            color: #fff;
            background: linear-gradient(135deg, #ffd700, #f7971e);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 24px rgba(247, 151, 30, 0.3);
            letter-spacing: 1px;
        }
        .modal-box .btn-close-modal:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 12px 32px rgba(247, 151, 30, 0.5);
        }
        .modal-box .btn-close-modal:active {
            transform: scale(0.96);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 600px) {
            .container {
                padding: 20px 16px 28px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 22px;
            }
            .header .badge {
                font-size: 11px;
                padding: 2px 12px;
            }
            .pointer svg {
                width: 34px;
                height: 38px;
            }
            .pointer {
                top: -14px;
            }
            .input-row textarea {
                font-size: 14px;
                min-height: 44px;
                padding: 10px 14px;
            }
            .btn-primary {
                font-size: 17px;
                padding: 10px 24px;
                min-width: 110px;
            }
            .modal-box {
                padding: 32px 24px 28px;
            }
            .modal-box .result-name {
                font-size: 36px;
            }
            .modal-box .emoji-big {
                font-size: 44px;
            }
            .controls {
                gap: 10px;
            }
            .action-row {
                gap: 8px;
            }
            .tag-item {
                font-size: 12px;
                padding: 3px 10px 3px 14px;
            }
            .tag-item .delete-btn {
                width: 18px;
                height: 18px;
                font-size: 14px;
            }
        }

        @media (max-width: 400px) {
            .container {
                padding: 14px 10px 20px;
                border-radius: 24px;
            }
            .header h1 {
                font-size: 18px;
            }
            .btn-primary {
                font-size: 15px;
                padding: 8px 18px;
                min-width: 90px;
            }
            .modal-box .result-name {
                font-size: 28px;
            }
            .input-row textarea {
                font-size: 13px;
                min-height: 38px;
                padding: 8px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🎯 班级点名幸运大转盘</h1>
            <span class="badge">✨ 公平 · 有趣</span>
        </div>

        <div class="wheel-wrapper">
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
            <div class="pointer" id="pointerEl">
                <svg viewBox="0 0 44 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="pointerGrad" x1="0.5" y1="0" x2="0.5" y2="1">
                            <stop offset="0%" stop-color="#FF3D3D"/>
                            <stop offset="40%" stop-color="#FF6B35"/>
                            <stop offset="100%" stop-color="#E62E2E"/>
                        </linearGradient>
                        <filter id="pointerShadow">
                            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.5"/>
                        </filter>
                    </defs>
                    <polygon points="22,48 2,4 42,4" fill="url(#pointerGrad)" filter="url(#pointerShadow)" stroke="#fff" stroke-width="1.5" stroke-opacity="0.25"/>
                    <circle cx="22" cy="10" r="4" fill="#fff" opacity="0.35"/>
                    <circle cx="22" cy="10" r="2" fill="#fff" opacity="0.6"/>
                </svg>
            </div>
        </div>

        <div class="controls">
            <div class="input-row">
                <textarea id="nameInput" placeholder="👥 输入名字，用逗号/空格/换行分隔&#10;例如：张三, 李四, 王五"></textarea>
            </div>

            <!-- 标签列表区域 -->
            <div class="tag-list" id="tagList"></div>

            <div class="action-row">
                <button class="btn-primary" id="actionBtn">
                    <span class="icon">🎰</span> 开始
                </button>
                <button class="btn-secondary" id="resetBtn">↻ 重置</button>
                <button class="btn-secondary danger" id="clearBtn">🗑 清空</button>
                <span class="counter" id="counter">👤 0 人</span>
            </div>
        </div>
    </div>

    <!-- 弹窗 -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <span class="emoji-big">🎉</span>
            <h2>🎊 恭喜被点中</h2>
            <div class="result-name" id="resultName">——</div>
            <button class="btn-close-modal" id="closeModalBtn">👍 太棒了</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ========== DOM ==========
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const nameInput = document.getElementById('nameInput');
            const actionBtn = document.getElementById('actionBtn');
            const resetBtn = document.getElementById('resetBtn');
            const clearBtn = document.getElementById('clearBtn');
            const counter = document.getElementById('counter');
            const resultModal = document.getElementById('resultModal');
            const resultName = document.getElementById('resultName');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const pointerEl = document.getElementById('pointerEl');
            const tagList = document.getElementById('tagList');

            // ========== 常量 ==========
            const W = 600,
                H = 600;
            const cx = W / 2,
                cy = H / 2,
                radius = 270;
            const STORAGE_KEY = 'wheelNames';

            // ========== 状态 ==========
            const STATE = { IDLE: 'idle', SPINNING: 'spinning', STOPPING: 'stopping', STOPPED: 'stopped' };
            let state = STATE.IDLE;
            let names = [];
            let currentAngle = 0;
            let speed = 0;
            let winningIndex = -1;
            let animationId = null;
            let isSpinning = false;
            const DECEL_FACTOR = 0.985;
            const MIN_SPEED = 0.002;
            const BASE_SPEED = 0.25;

            // ========== 工具函数 ==========
            function getColor(index, total) {
                if (total <= 1) return '#FF6B6B';
                return `hsl(${(index / total) * 360}, 82%, 62%)`;
            }

            function lightenColor(color, amount) {
                if (color.startsWith('hsl')) {
                    return color.replace(/(\d+)%\)/, (match, p1) => {
                        const v = Math.min(100, parseInt(p1) + amount);
                        return `${v}%)`;
                    });
                }
                return color;
            }

            function getColorBrightness(color) {
                if (color.startsWith('hsl')) {
                    const match = color.match(/(\d+)%\)/);
                    if (match) return parseInt(match[1]);
                    return 60;
                }
                if (color.startsWith('#')) {
                    const hex = color.replace('#', '');
                    let r, g, b;
                    if (hex.length === 3) {
                        r = parseInt(hex[0] + hex[0], 16);
                        g = parseInt(hex[1] + hex[1], 16);
                        b = parseInt(hex[2] + hex[2], 16);
                    } else if (hex.length === 6) {
                        r = parseInt(hex.slice(0, 2), 16);
                        g = parseInt(hex.slice(2, 4), 16);
                        b = parseInt(hex.slice(4, 6), 16);
                    } else return 120;
                    return (r * 299 + g * 587 + b * 114) / 1000;
                }
                return 120;
            }

            // ========== 增强的解析函数 ==========
            function parseNames(text) {
                if (!text || text.trim().length === 0) return [];
                // 将常见分隔符统一替换为英文逗号
                let raw = text.replace(/[，、；;、\n\r\t]+/g, ',').split(',').map(s => s.trim()).filter(s => s.length > 0);
                // 如果没有逗号分隔，尝试按空白分割（空格、换行等）
                if (raw.length === 0 && text.trim().length > 0) {
                    raw = text.split(/\s+/).map(s => s.trim()).filter(s => s.length > 0);
                }
                // 去重（保留顺序）
                const seen = new Set();
                return raw.filter(name => {
                    if (seen.has(name)) return false;
                    seen.add(name);
                    return true;
                });
            }

            function getPointerAngle() { return -Math.PI / 2; }

            function getSectorIndex(angle, total) {
                let a = ((angle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
                const sectorSize = (2 * Math.PI) / total;
                const idx = Math.floor(a / sectorSize);
                return Math.min(idx, total - 1);
            }

            // ========== 绘制转盘 ==========
            function drawWheel(highlightIndex = -1) {
                ctx.clearRect(0, 0, W, H);
                const total = names.length;
                if (total === 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = 'rgba(255,255,255,0.04)';
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.font = '20px "Poppins", "Segoe UI", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('📝 请输入名字', cx, cy);
                    ctx.restore();
                    return;
                }

                const sectorSize = (2 * Math.PI) / total;
                for (let i = 0; i < total; i++) {
                    const start = i * sectorSize + currentAngle;
                    const end = (i + 1) * sectorSize + currentAngle;
                    const isHighlight = (i === highlightIndex && highlightIndex >= 0);

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.arc(cx, cy, radius, start, end);
                    ctx.closePath();

                    if (isHighlight) {
                        const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                        grad.addColorStop(0, '#ffd700');
                        grad.addColorStop(0.5, '#ffb800');
                        grad.addColorStop(1, '#f7971e');
                        ctx.fillStyle = grad;
                    } else {
                        const color = getColor(i, total);
                        const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, radius);
                        grad.addColorStop(0, lightenColor(color, 30));
                        grad.addColorStop(1, color);
                        ctx.fillStyle = grad;
                    }
                    ctx.fill();
                    ctx.strokeStyle = isHighlight ? 'rgba(255,215,0,0.8)' : 'rgba(255,255,255,0.25)';
                    ctx.lineWidth = isHighlight ? 3 : 1.5;
                    ctx.stroke();
                    ctx.restore();

                    // 文字
                    const midAngle = start + sectorSize / 2;
                    const textRadius = radius * 0.68;
                    const x = cx + Math.cos(midAngle) * textRadius;
                    const y = cy + Math.sin(midAngle) * textRadius;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(midAngle + Math.PI / 2);
                    let fontSize = Math.min(28, radius * 0.12, 120 / total + 10);
                    fontSize = Math.max(11, fontSize);
                    if (names[i].length > 6) fontSize *= 0.75;
                    if (names[i].length > 10) fontSize *= 0.7;
                    ctx.font = `600 ${fontSize}px "PingFang SC", "Poppins", "Segoe UI", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.shadowColor = 'rgba(0,0,0,0.6)';
                    ctx.shadowBlur = 8;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 2;
                    if (isHighlight) {
                        ctx.fillStyle = '#fff';
                        ctx.shadowColor = 'rgba(0,0,0,0.8)';
                        ctx.shadowBlur = 12;
                    } else {
                        const bgColor = getColor(i, total);
                        const brightness = getColorBrightness(bgColor);
                        ctx.fillStyle = brightness > 160 ? '#1a1a2e' : '#ffffff';
                        ctx.shadowColor = 'rgba(0,0,0,0.5)';
                        ctx.shadowBlur = 6;
                    }
                    let displayName = names[i];
                    if (displayName.length > 12) displayName = displayName.slice(0, 10) + '…';
                    ctx.fillText(displayName, 0, 0);
                    ctx.restore();
                }

                // 中心装饰
                ctx.save();
                const gradient = ctx.createRadialGradient(cx - 8, cy - 8, 0, cx, cy, 38);
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.3, '#ffd700');
                gradient.addColorStop(1, '#f7971e');
                ctx.beginPath();
                ctx.arc(cx, cy, 34, 0, 2 * Math.PI);
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                ctx.lineWidth = 3;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(cx - 8, cy - 10, 12, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.fill();
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, radius + 6, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(255,255,255,0.06)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            function updateWheel(highlightIndex = -1) { drawWheel(highlightIndex); }

            // ========== 本地存储 ==========
            function saveNamesToStorage() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(names));
            }

            function loadNamesFromStorage() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return parsed;
                        }
                    } catch (e) { /* ignore */ }
                }
                return null;
            }

            // ========== 更新 UI 标签列表 ==========
            function renderTags() {
                tagList.innerHTML = '';
                names.forEach((name, index) => {
                    const tag = document.createElement('span');
                    tag.className = 'tag-item';
                    tag.innerHTML = `
                        ${name}
                        <button class="delete-btn" data-index="${index}" title="删除 ${name}">✕</button>
                    `;
                    tagList.appendChild(tag);
                });
                // 绑定删除事件
                tagList.querySelectorAll('.delete-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.index, 10);
                        if (!isNaN(idx) && idx >= 0 && idx < names.length) {
                            deleteNameAtIndex(idx);
                        }
                    });
                });
            }

            // ========== 核心操作 ==========
            // 从输入框加载名字，更新全局 names，刷新 UI 和转盘
            function loadNames() {
                const text = nameInput.value;
                const parsed = parseNames(text);
                names = parsed;
                counter.textContent = `👤 ${names.length} 人`;
                renderTags();
                saveNamesToStorage();

                // 更新按钮状态
                if (names.length === 0) {
                    state = STATE.IDLE; // 强制空闲
                    actionBtn.disabled = true;
                    actionBtn.innerHTML = `<span class="icon">⚠️</span> 无名字`;
                    actionBtn.classList.remove('is-stopping');
                } else {
                    actionBtn.disabled = false;
                    if (state === STATE.IDLE || state === STATE.STOPPED) {
                        actionBtn.innerHTML = `<span class="icon">🎰</span> 开始`;
                        actionBtn.classList.remove('is-stopping');
                    }
                }
                // 重置高亮并重绘
                winningIndex = -1;
                updateWheel(-1);
            }

            function deleteNameAtIndex(index) {
                if (state === STATE.SPINNING || state === STATE.STOPPING) return;
                names.splice(index, 1);
                nameInput.value = names.join(',');
                loadNames(); // 刷新
                if (state === STATE.STOPPED) {
                    state = STATE.IDLE;
                    actionBtn.innerHTML = `<span class="icon">🎰</span> 开始`;
                    actionBtn.classList.remove('is-stopping');
                }
                winningIndex = -1;
                updateWheel(-1);
            }

            function clearAllNames() {
                if (state === STATE.SPINNING || state === STATE.STOPPING) return;
                if (names.length === 0) return;
                if (confirm('确定要清空所有名单吗？')) {
                    names = [];
                    nameInput.value = '';
                    loadNames();
                    state = STATE.IDLE;
                    actionBtn.innerHTML = `<span class="icon">🎰</span> 开始`;
                    actionBtn.classList.remove('is-stopping');
                    winningIndex = -1;
                    updateWheel(-1);
                    localStorage.removeItem(STORAGE_KEY);
                }
            }

            // ========== 旋转逻辑 ==========
            function startSpin() {
                // 先同步输入框，确保名单最新
                loadNames();
                const total = names.length;
                if (total < 2) {
                    if (total === 1) {
                        showResult(names[0]);
                        return;
                    }
                    alert('👀 至少需要 2 个名字才能开始！');
                    return;
                }

                nameInput.disabled = true;
                winningIndex = -1;
                currentAngle = currentAngle % (2 * Math.PI);
                speed = BASE_SPEED + Math.random() * 0.08;
                state = STATE.SPINNING;
                isSpinning = true;
                actionBtn.innerHTML = `<span class="icon">⏹</span> 停止`;
                actionBtn.classList.remove('is-stopping');
                actionBtn.disabled = false;
                pointerEl.classList.add('active');
                if (animationId) cancelAnimationFrame(animationId);
                animate();
            }

            function stopSpin() {
                if (state !== STATE.SPINNING) return;
                state = STATE.STOPPING;
                actionBtn.innerHTML = `<span class="icon">⏳</span> 减速中...`;
                actionBtn.disabled = true;
                actionBtn.classList.add('is-stopping');
                pointerEl.classList.remove('active');
            }

            function animate() {
                if (!isSpinning) return;
                if (state === STATE.SPINNING) {
                    currentAngle += speed;
                    updateWheel(-1);
                    animationId = requestAnimationFrame(animate);
                } else if (state === STATE.STOPPING) {
                    speed *= DECEL_FACTOR;
                    currentAngle += speed;
                    if (speed < MIN_SPEED) {
                        speed = 0;
                        state = STATE.STOPPED;
                        isSpinning = false;
                        nameInput.disabled = false;
                        actionBtn.innerHTML = `<span class="icon">🎰</span> 开始`;
                        actionBtn.classList.remove('is-stopping');
                        actionBtn.disabled = false;
                        pointerEl.classList.remove('active');
                        const total = names.length;
                        const pointerAngle = getPointerAngle();
                        const angleInWheel = pointerAngle - currentAngle;
                        const idx = getSectorIndex(angleInWheel, total);
                        winningIndex = idx;
                        const winner = names[idx];
                        updateWheel(idx);
                        setTimeout(() => { showResult(winner); }, 300);
                        animationId = null;
                        return;
                    }
                    updateWheel(-1);
                    animationId = requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                }
            }

            function resetWheel() {
                if (state === STATE.SPINNING || state === STATE.STOPPING) {
                    isSpinning = false;
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                        animationId = null;
                    }
                }
                state = STATE.IDLE;
                currentAngle = 0;
                speed = 0;
                winningIndex = -1;
                nameInput.disabled = false;
                actionBtn.innerHTML = `<span class="icon">🎰</span> 开始`;
                actionBtn.classList.remove('is-stopping');
                actionBtn.disabled = false;
                pointerEl.classList.remove('active');
                resultModal.classList.remove('open');
                loadNames(); // 重新加载并刷新
                updateWheel(-1);
            }

            function showResult(name) {
                resultName.textContent = name;
                resultModal.classList.add('open');
            }

            // ========== 初始化 ==========
            function init() {
                // 从 storage 读取，如果没有则使用默认名单
                const storedNames = loadNamesFromStorage();
                if (storedNames) {
                    names = storedNames;
                    nameInput.value = names.join(',');
                } else {
                    const defaultNames = ['张子轩', '李雨桐', '王浩然', '刘思琪', '陈子豪', '杨紫萱', '赵子涵', '黄梓睿', '周若曦', '吴子骞', '徐梓萌', '孙逸飞',
                        '林静雅', '何子骞', '高梓欣', '罗逸尘', '郑乐怡', '梁子轩', '谢欣然', '韩子睿'
                    ];
                    names = defaultNames;
                    nameInput.value = defaultNames.join(',');
                    saveNamesToStorage();
                }
                loadNames(); // 这会更新 UI 和转盘
                updateWheel(-1);

                // 事件绑定
                nameInput.addEventListener('input', function() {
                    // 只在空闲或停止状态下自动更新，旋转时输入框被禁用不会触发
                    if (state === STATE.IDLE || state === STATE.STOPPED) {
                        loadNames();
                    }
                });

                actionBtn.addEventListener('click', function() {
                    if (state === STATE.IDLE || state === STATE.STOPPED) {
                        // 先同步
                        loadNames();
                        const total = names.length;
                        if (total < 2) {
                            if (total === 1) {
                                showResult(names[0]);
                                return;
                            }
                            alert('👀 至少需要 2 个名字才能开始！');
                            return;
                        }
                        if (state === STATE.STOPPED) {
                            resultModal.classList.remove('open');
                            winningIndex = -1;
                        }
                        startSpin();
                    } else if (state === STATE.SPINNING) {
                        stopSpin();
                    }
                });

                resetBtn.addEventListener('click', resetWheel);
                clearBtn.addEventListener('click', clearAllNames);

                closeModalBtn.addEventListener('click', function() {
                    resultModal.classList.remove('open');
                });
                resultModal.addEventListener('click', function(e) {
                    if (e.target === resultModal) resultModal.classList.remove('open');
                });
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape') resultModal.classList.remove('open');
                    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
                    if (e.key === ' ' || e.key === 'Space') {
                        e.preventDefault();
                        actionBtn.click();
                    }
                    if (e.key === 'r' || e.key === 'R') resetBtn.click();
                });

                // 窗口自适应重绘
                let resizeTimer;
                window.addEventListener('resize', function() {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(() => {
                        if (state === STATE.IDLE || state === STATE.STOPPED) {
                            updateWheel(winningIndex);
                        } else {
                            updateWheel(-1);
                        }
                    }, 200);
                });
            }

            init();

            // 暴露调试
            window.__wheel = {
                names: () => names,
                state: () => state,
                reset: resetWheel,
                start: startSpin,
                stop: stopSpin,
            };

        })();
    </script>

</body>
